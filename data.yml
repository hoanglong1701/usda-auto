name: GDHH247 du lieu tu dong

on:
  schedule:
    - cron: "45 12 * * 4"
    - cron: "30 13 * * 4"
    - cron: "30 14 * * 4"
    - cron: "30 0 * * 5"
    - cron: "30 17,19,23 * * 1"
    - cron: "30 2 * * 2"
    - cron: "30 17 * * 2"
    - cron: "10 20,21,22 * * 1"
    - cron: "10 20,21 * * 2"
  workflow_dispatch:
    inputs:
      job:
        description: "Job can chay (esr, insp, prog hoac all)"
        default: "all"

concurrency:
  group: gdhh247-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chay job
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
          INPUT_JOB: ${{ github.event.inputs.job }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          JOB="$INPUT_JOB"
          if [ -z "$JOB" ]; then
            case "$SCHEDULE" in
              "45 12 * * 4"|"30 13 * * 4"|"30 14 * * 4"|"30 0 * * 5") JOB=esr;;
              "30 17,19,23 * * 1"|"30 2 * * 2"|"30 17 * * 2") JOB=insp;;
              *) JOB=prog;;
            esac
          fi
          if [ "$JOB" = "all" ]; then JOB="esr insp prog"; fi
          echo "Job: $JOB"
          python run.py $JOB
      - name: Luu trang thai
        if: always()
        run: |
          git config user.name "gd-bot"
          git config user.email "gd-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +%FT%TZ)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
