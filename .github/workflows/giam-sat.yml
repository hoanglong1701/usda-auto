name: GDHH247 giam sat va lam nong cache

# Moi 30 phut: goi lai cac trang chinh (lam nong cache), roi kiem tra DNS, trang, du lieu, sitemap.
# Co loi thi job do va GitHub gui email cho chu repo.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gdhh247-giam-sat
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  giam_sat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lam nong cache
        continue-on-error: true
        run: python lam_nong_cache.py
      - name: Kiem tra
        id: kt
        run: python giam_sat.py
      - name: Luu trang thai khi doi
        if: always()
        run: |
          git config user.name "gd-bot"
          git config user.email "gd-bot@users.noreply.github.com"
          git add data/health.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "health: $(date -u +%FT%TZ)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
