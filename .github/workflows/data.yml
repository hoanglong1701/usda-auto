name: GDHH247 du lieu tu dong

on:
  schedule:
    - cron: "45 12 * * 4"
    - cron: "30 13 * * 4"
    - cron: "30 14 * * 4"
    - cron: "30 0 * * 5"
    - cron: "30 17,19,23 * * 1"
    - cron: "30 2 * * 2"
    - cron: "30 17 * * 2"
    - cron: "10 20,21,22 * * 1"
    - cron: "10 20,21 * * 2"
    - cron: "20 1 * * *"
    - cron: "30 8,10 * * 5"
    - cron: "15 16,17,18 8-14 * *"
    - cron: "10 1 * * *"
    - cron: "25 10 6 * *"
    - cron: "40 0 * * 2-6"
    - cron: "15 1 * * 2,3"
    - cron: "50 22 * * 1-5"
    - cron: "0 3,9 * * 1-6"
    - cron: "0 22 * * 0"
    - cron: "50 12,13,14,15 * * 1-5"
    - cron: "20 0 * * 2-6"
    - cron: "0 21 * * 5"
    - cron: "0 2 * * 1"
    - cron: "30 3 12,25 * *"
    - cron: "40 2,5 * * *"
    - cron: "30 23 * * 1-5"
  push:
    paths:
      - data/bao_cao.json
  workflow_dispatch:
    inputs:
      job:
        description: "Job can chay (esr, insp, prog, orgs, wasde, probe, fred_test, fred_monthly, yeu_to, dinh_luong, dinh_luong_thu, kl_nlcn, ns_enso, gia_vn, gia_vn_thu, lam_nong_cache, chan_doan, lich_kt, lich_kt_thu, anh_chuyen_muc, sua_menu_trang, cot, cot_thu, nang_luong, tuyen_duong, gia_ca_phe, gia_fob hoac all)"
        default: "all"

concurrency:
  group: gdhh247-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chay job
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          INPUT_JOB: ${{ github.event.inputs.job }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          JOB="$INPUT_JOB"
          if [ "$EVENT" = "push" ]; then JOB=kl_nlcn; fi
          if [ -z "$JOB" ]; then
            case "$SCHEDULE" in
              "45 12 * * 4"|"30 13 * * 4"|"30 14 * * 4"|"30 0 * * 5") JOB=esr;;
              "30 17,19,23 * * 1"|"30 2 * * 2"|"30 17 * * 2") JOB=insp;;
              "10 20,21,22 * * 1"|"10 20,21 * * 2") JOB=prog;;
              "15 16,17,18 8-14 * *") JOB=wasde;;
              "10 1 * * *") JOB=probe;;
              "25 10 6 * *") JOB=fred_monthly;;
              "40 0 * * 2-6") JOB=yeu_to;;
              "15 1 * * 2,3") JOB=dinh_luong;;
              "50 22 * * 1-5") JOB="kl_nlcn ns_enso";;
              "0 3,9 * * 1-6") JOB=gia_vn;;
              "0 22 * * 0"|"50 12,13,14,15 * * 1-5"|"20 0 * * 2-6") JOB=lich_kt;;
              "0 21 * * 5"|"0 2 * * 1") JOB=cot;;
              "30 3 12,25 * *") JOB=nang_luong;;
              "40 2,5 * * *") JOB=gia_ca_phe;;
              "30 23 * * 1-5") JOB=gia_fob;;
              *) JOB=orgs;;
            esac
          fi
          if [ "$JOB" = "all" ]; then JOB="esr insp prog orgs wasde probe yeu_to"; fi
          echo "Job: $JOB"
          # sau job du lieu, goi lai cac trang chinh de cache duoc tao san
          case "$JOB" in
            *sua_*|chan_doan|lam_nong_cache) python run.py $JOB;;
            *) python run.py $JOB lam_nong_cache;;
          esac
      - name: Luu trang thai
        if: always()
        run: |
          git config user.name "gd-bot"
          git config user.email "gd-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date -u +%FT%TZ)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
